<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="tamagotchi-container">
        <h1>Tamagotchi</h1>
        <section class="status">
            <p id="hunger">Honger: <span id="hungertoon"></span></p>
            <div class="status-bar">
                <div id="hungerBar" class="hunger-bar" style="width: 100%;">
                </div>
            </div>
            <p id="energy">Energie: <span id="energytoon"></span></p>
            <div class="status-bar">
                <div id="energyBar" class="energy-bar" style="width: 100%;">
                </div>
            </div>
            <p id="happiness">Geluk: <span id="happinesstoon"></span></p>
            <div class="status-bar">
                <div id="happinessBar" class="happiness-bar" style="width: 100%;">
                </div>
            </div>
            <p id="statusMessage"></p>
        </section>

        <div class="button-container">
            <button id="feed">Voeden</button>
            <button id="sleep">Slapen</button>
            <button id="play">Spelen</button>
        </div>
    </section>

</div>
    <script src="app.js">
    </script>
</body>
</html>
